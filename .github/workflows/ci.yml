name: ci
on: [push, pull_request]
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
  cre-workflow:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cre/kyb-attest } }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: npx tsc --noEmit
      - run: bun test
